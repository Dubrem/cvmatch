databases:
  - name: cvmatch-db
    plan: free
    databaseName: cvmatch
    user: cvmatch

services:
  - type: web
    name: cvmatch
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: cvmatch-db
          property: connectionString
